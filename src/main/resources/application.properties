spring.application.name=Apache Camel POC

spring.datasource.url=jdbc:postgresql://localhost:5432/camel_demo
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
#logging.level.org.flywaydb=DEBUG


camel.main.run-controller=true


# lakeFS connection settings
lakefs.endpoint=${LAKEFS_ENDPOINT:http://localhost:8000}
lakefs.access-key=${LAKEFS_ACCESS_KEY}
lakefs.secret-key=${LAKEFS_SECRET_KEY}
